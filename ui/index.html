<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timelapses</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Timelapses</h1>
  <nav><a href="./" aria-current="page">Player</a><a href="exports.html">Exports</a><a href="manage.html">Streams</a></nav>
  <button id="logout" class="link" hidden>Log out</button>
</header>
<div class="stream-bar">
  <select id="stream" aria-label="Stream"></select>
  <span id="stream-info" class="muted"></span>
</div>

<main>
  <div class="ranges">
    <button data-range="all">Everything</button>
    <button data-range="86400000">Last 24 h</button>
    <button data-range="3600000">Last hour</button>
    <button data-range="live">Live</button>
    <span class="custom">
      <input type="datetime-local" id="from" aria-label="From">
      –
      <input type="datetime-local" id="to" aria-label="To">
      <button id="load-custom">Show</button>
    </span>
  </div>

  <video id="video" controls muted playsinline></video>

  <div class="readout">
    <span>
      <span id="clock">–</span>
      <span id="live" class="live" hidden><span class="dot"></span>LIVE · <span id="live-lag"></span></span>
      <button type="button" id="jump-live" hidden>Jump to newest</button>
    </span>
    <label class="muted">speed
      <select id="rate">
        <option value="0.25">¼×</option>
        <option value="0.5">½×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
    </label>
  </div>

  <div id="timeline" class="timeline"></div>
  <div class="timeline-tools muted small">
    <span>Click to jump · scroll to zoom · drag to pan · shift-drag to select a clip · double-click to see it all</span>
    <span>
      <button type="button" id="zoom-in" title="Zoom in">+</button>
      <button type="button" id="zoom-out" title="Zoom out">−</button>
      <button type="button" id="zoom-fit">All</button>
    </span>
  </div>

  <p id="message" class="muted"></p>

  <section class="export" aria-label="Export a clip">
    <h2>Export a clip</h2>
    <div class="export-row">
      <label>From <input type="datetime-local" id="export-from" step="1"></label>
      <button type="button" id="mark-from" title="Use the current playback position">Set to now playing</button>
      <label>To <input type="datetime-local" id="export-to" step="1"></label>
      <button type="button" id="mark-to" title="Use the current playback position">Set to now playing</button>
    </div>
    <div class="export-row">
      <label><input type="radio" name="export-mode" value="fast" checked> Fast: copies the video; starts at the
        keyframe before "From"</label>
      <label><input type="radio" name="export-mode" value="exact"> Exact: re-encodes; cuts to the frame, slower</label>
    </div>
    <div class="export-row">
      <button type="button" id="export" class="primary">Export</button>
      <span id="export-message" class="muted"></span>
    </div>
  </section>
</main>

<script src="vendor/hls.min.js"></script>
<script src="common.js"></script>
<script src="timeline.js"></script>
<script src="player.js"></script>
</body>
</html>
