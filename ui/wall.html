<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timelapses · wall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Timelapses</h1>
  <nav><a href="./">Player</a><a href="wall.html" aria-current="page">Wall</a><a href="exports.html">Exports</a><a href="manage.html">Streams</a></nav>
  <button id="logout" class="link" hidden>Log out</button>
</header>
<div class="stream-bar">
  <span class="muted">Cameras (up to 4):</span>
  <span id="pickers" class="pickers"></span>
</div>

<main>
  <div class="ranges">
    <button data-range="all">Everything</button>
    <button data-range="86400000">Last 24 h</button>
    <button data-range="3600000">Last hour</button>
    <button data-range="live">Live</button>
  </div>

  <section id="wall" class="player wall" aria-label="Wall">
    <div id="grid" class="wall-grid"></div>
    <div class="controls">
      <button type="button" id="play" class="play" title="Play (space)"><span class="glyph">▶</span></button>
      <span id="clock">–</span>
      <span id="live" class="live" hidden><span class="dot"></span>LIVE · <span id="live-lag"></span></span>
      <span id="waiting" class="muted small" hidden>loading…</span>
      <span class="spacer"></span>
      <label class="muted">speed
        <select id="rate">
          <option value="0.25">¼×</option>
          <option value="0.5">½×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>
      <button type="button" id="fullscreen" title="Fullscreen (f)">Fullscreen</button>
    </div>
    <div id="timeline" class="timeline"></div>
    <div class="timeline-tools muted small">
      <span>All cameras follow one clock · click to jump · scroll to zoom · drag to pan · shift-drag to select ·
        keys: space, ←/→, ,/. for frames, f</span>
      <span>
        <button type="button" id="zoom-in" title="Zoom in">+</button>
        <button type="button" id="zoom-out" title="Zoom out">−</button>
        <button type="button" id="zoom-fit">All</button>
      </span>
    </div>
  </section>

  <p id="message" class="muted"></p>

  <section class="export" aria-label="Export every camera">
    <h2>Export the same moment from every camera</h2>
    <div class="export-row">
      <span id="export-range" class="muted">Shift-drag on the timeline to pick a range.</span>
    </div>
    <div class="export-row">
      <label><input type="radio" name="export-mode" value="fast" checked> Fast (from the keyframe before)</label>
      <label><input type="radio" name="export-mode" value="exact"> Exact (re-encodes)</label>
      <button type="button" id="export" class="primary">Export each camera</button>
      <span id="export-message" class="muted"></span>
    </div>
  </section>
</main>

<script src="vendor/hls.min.js"></script>
<script src="common.js"></script>
<script src="timeline.js"></script>
<script src="camplayer.js"></script>
<script src="controls.js"></script>
<script src="wall.js"></script>
</body>
</html>
